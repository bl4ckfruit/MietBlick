# Optionaler Weg: MietBlick bei jedem Start automatisch neu bauen und
# auf GitHub Pages veröffentlichen.
#
# Nötig dafür: im Repository unter Settings → Pages die Quelle auf
# "GitHub Actions" stellen. Danach diesen Workflow unter dem Reiter
# "Actions" einmal über "Run workflow" starten.
#
# Wenn ihr stattdessen den einfachen Weg über den Ordner /docs nutzt
# (Settings → Pages → Deploy from a branch → main → /docs), braucht ihr
# diese Datei nicht und könnt sie löschen.

name: MietBlick auf GitHub Pages veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: App bauen
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
