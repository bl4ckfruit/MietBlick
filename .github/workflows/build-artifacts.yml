name: Fertige App aktualisieren

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/build-artifacts.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install
      - name: App bauen
        run: npm run build
      - name: Fertige Dateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs MietBlick.html
          if git diff --cached --quiet; then
            echo "Keine Build-Änderungen."
          else
            git commit -m "Update built app"
            git push origin main
          fi
